name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run Go core tests
        run: cd core && go test ./... -v
      - name: Build Whim.app and whim-mcp
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-macos.sh
          ./scripts/build-mcp.sh
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Whim.app Whim-macOS.zip
          tar -czf whim-mcp-macos-arm64.tar.gz whim-mcp
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/Whim-macOS.zip
            dist/whim-mcp-macos-arm64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK & gomobile
        run: |
          sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p android/app/libs
          cd core && gomobile bind -target=android -androidapi 26 -o ../android/app/libs/whimcore.aar ./mobile
      - name: Decode Android release keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/whim-release.jks
            echo "WHIM_KEYSTORE_PATH=whim-release.jks" >> "$GITHUB_ENV"
            echo "Decoded release keystore for consistent APK signing."
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not set; falling back to ephemeral debug keystore."
          fi
      - name: Build Android Release APK
        uses: gradle/actions/setup-gradle@v4
      - env:
          WHIM_KEYSTORE_PASSWORD: ${{ secrets.WHIM_KEYSTORE_PASSWORD }}
          WHIM_KEY_ALIAS: ${{ secrets.WHIM_KEY_ALIAS }}
          WHIM_KEY_PASSWORD: ${{ secrets.WHIM_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Whim-Android.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: Whim-Android.apk

  publish:
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd release-files
          sha256sum Whim-macOS.zip whim-mcp-macos-arm64.tar.gz Whim-Android.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/Whim-macOS.zip
            release-files/whim-mcp-macos-arm64.tar.gz
            release-files/Whim-Android.apk
            release-files/SHA256SUMS.txt
